name: Release artifacts

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-artifacts-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version: current
          check-latest: true
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Pack server package
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" = dev ]; then
            bun run pack:howcode:dev
          else
            bun run pack:howcode
          fi
      - name: Verify installed runtime dependencies
        shell: bash
        run: |
          package=$(realpath artifacts/howcode-*.tgz)
          install_root=$(mktemp -d)
          cd "$install_root"
          npm init -y
          npm install "$package"
          node -e "require('node-pty'); require('sherpa-onnx-node'); require('node:sqlite')"
          test -f node_modules/howcode/build/server/index.mjs
          test -f node_modules/howcode/dist/index.html
      - uses: actions/upload-artifact@v7
        with:
          name: howcode-server-package
          if-no-files-found: error
          path: artifacts/howcode-*.tgz
